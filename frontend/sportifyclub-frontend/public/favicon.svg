<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="barcaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004d98" />
      <stop offset="100%" stop-color="#a50044" />
    </linearGradient>
  </defs>
  <!-- Base circle -->
  <circle cx="50" cy="50" r="45" fill="url(#barcaGrad)" />
  
  <!-- Outer border -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#edbb00" stroke-width="4" />
  
  <!-- "S" for Sportify -->
  <path d="M 60 35 C 60 25, 40 25, 40 35 C 40 45, 60 55, 60 65 C 60 75, 40 75, 40 65" 
        fill="none" stroke="#edbb00" stroke-width="8" stroke-linecap="round" />
        
  <!-- Ball/dot -->
