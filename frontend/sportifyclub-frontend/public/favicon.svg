<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular -->
  <circle cx="50" cy="50" r="45" fill="#004d98"/>
  
  <!-- Cancha de tenis/pádel -->
  <rect x="25" y="30" width="50" height="40" fill="none" stroke="#edbb00" stroke-width="2"/>
  
  <!-- Líneas de la cancha -->
  <line x1="50" y1="30" x2="50" y2="70" stroke="#edbb00" stroke-width="1.5"/>
  <line x1="25" y1="50" x2="75" y2="50" stroke="#edbb00" stroke-width="1.5"/>
  
  <!-- Raqueta estilizada -->
  <circle cx="60" cy="40" r="8" fill="#a50044" stroke="#edbb00" stroke-width="1.5"/>
  <line x1="60" y1="48" x2="60" y2="62" stroke="#a50044" stroke-width="2"/>
  
  <!-- Pelota -->
  <circle cx="35" cy="58" r="3" fill="#edbb00"/>
</svg>
